# 로컬 compose 전용 nginx 설정 (S15P31A108-120). 서버 설정의 정본은 sites-available/ 이다.
# 정적 파일 부분과 /api·/actuator/health 프록시는 sites-available/dev.beez.ai.kr.conf 와 같은 역할이다.
# 서버는 호스트 Nginx 가 127.0.0.1 의 backend 로 넘긴다 (S15P31A108-123, docs/infra/cd.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 API. 컨테이너 이름(backend)으로 찾는다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 연결 확인용 헬스만 연다. 서버도 같다.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 아래는 dev.beez.ai.kr.conf 와 같다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
