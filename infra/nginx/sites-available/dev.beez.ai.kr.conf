# backend 컨테이너 (S15P31A108-123). compose 가 127.0.0.1 에만 연다 — 포트는 서버 env 파일의 BACKEND_HOST_PORT.
# 8080 은 Jenkins 가 쓰므로 8081 이다.
upstream beez_backend {
    server 127.0.0.1:8081;
    keepalive 16;                # Nginx ↔ backend 연결을 재사용한다 (아래 Connection "" 와 짝)
}

# HTTP는 인증서 발급 경로만 남기고 HTTPS로 넘긴다.
server {
    listen 80;
    listen [::]:80;
    server_name dev.beez.ai.kr;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 프론트 정적 파일(dist) 서빙. 배포는 /var/www/beez/releases/<sha>에 풀고 current 심링크를 바꾼다.
# 인증서는 certbot certonly --webroot로 발급하며 certbot은 이 파일을 수정하지 않는다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.beez.ai.kr;

    ssl_certificate /etc/letsencrypt/live/dev.beez.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.beez.ai.kr/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/beez/current;
    index index.html;

    # 백엔드 API (S15P31A108-123). 프론트는 같은 주소의 /api 로 부른다 (frontend/src/api/client.ts)
    location /api/ {
        # 업로드 상한은 backend 의 multipart max-request-size(2MB)와 맞춘다.
        # Nginx 기본값(1m)이면 1~2MB 요청이 backend 에 닿기 전에 413 이 난다
        client_max_body_size 2m;
        proxy_pass http://beez_backend;
        include snippets/beez-backend-proxy.conf;
    }

    # 에이전트 MCP 연결 (S15P31A108-123). 응답을 흘려 보내는(스트리밍) 연결이라
    # 버퍼에 모으지 않고, 오래 열린 연결이 끊기지 않게 읽기 대기 시간을 늘린다
    location /mcp {
        # 에이전트가 문서 본문(backend 상한 1MB, JSON 으로 감싸면 더 커짐)을 보낼 수 있어 /api 와 같은 상한을 둔다
        client_max_body_size 2m;
        proxy_pass http://beez_backend;
        include snippets/beez-backend-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # 연결 확인용 헬스만 연다 (상세는 prod 프로필에서 숨김). 다른 /actuator 경로는 열지 않는다
    location = /actuator/health {
        proxy_pass http://beez_backend;
        include snippets/beez-backend-proxy.conf;
    }

    # SPA fallback: 파일이 없는 경로는 index.html로 넘겨 클라이언트 라우터가 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 결과물은 파일명에 해시가 붙어 있어 오래 캐시해도 된다.
    # 없는 파일은 index.html 대신 404를 돌려 MIME 오류를 막는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html은 매번 재검증해 새 배포가 바로 반영되게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
