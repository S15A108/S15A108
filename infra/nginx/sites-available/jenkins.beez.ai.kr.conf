# Jenkins 관리 화면 (S15P31A108-126). Jenkins 는 127.0.0.1:8080 에서만 받고, 외부 접근은 이 HTTPS 호스트로만 한다.
# 프록시 값은 Jenkins 공식 문서의 Nginx 리버스 프록시 예시를 기준으로 했다.

upstream jenkins_backend {
    server 127.0.0.1:8080;
    keepalive 32;                # Nginx ↔ Jenkins 연결을 재사용한다
}

# 웹소켓 요청이면 Connection: upgrade 를 넘기고, 아니면 Connection 헤더를 비운다.
# 비우면 Nginx 가 헤더를 보내지 않아 위 keepalive 연결이 재사용된다 ('close' 를 보내면 매번 끊긴다).
map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    ''      "";
}

# 비밀번호 대입 제한. Jenkins 는 기본적으로 계정 잠금이 없어 Nginx 에서 IP별 횟수를 제한한다.
# 인증을 싣는 요청만 센다: Authorization 헤더(Basic 인증·API 토큰)가 있거나 로그인 폼 제출.
# 키가 빈 문자열이면 Nginx 는 그 요청을 세지 않으므로, 로그인 뒤 세션 쿠키로 다니는 화면 이동은 제한받지 않는다.
#
# API 토큰 요청에 한도를 따로 두지 않는다 (S15P31A108-123). API 토큰과 비밀번호는 둘 다
# "Authorization: Basic" 으로 와서 Nginx 가 구분하지 못하므로, API 한도를 늘리면 비밀번호 대입 한도도 같이 늘어난다.
# 정상 API 사용은 Actions 의 배포 잡 호출뿐이고 배포 1회당 1요청(결과를 기다리며 조회하지 않음)이라 분당 10회 안에 든다.
# 상태 조회를 반복하는 클라이언트를 붙이게 되면 그때 경로별 한도를 다시 정한다.
map $http_authorization $jenkins_auth_key {
    ""      "";
    default $binary_remote_addr;
}
map $uri $jenkins_login_key {
    /j_spring_security_check $binary_remote_addr;
    default                  "";
}
limit_req_zone $jenkins_auth_key  zone=jenkins_auth:1m  rate=10r/m;
limit_req_zone $jenkins_login_key zone=jenkins_login:1m rate=5r/m;

# HTTP는 인증서 발급 경로만 남기고 HTTPS로 넘긴다.
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.beez.ai.kr;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.beez.ai.kr;

    ssl_certificate /etc/letsencrypt/live/jenkins.beez.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.beez.ai.kr/privkey.pem;
    include snippets/ssl-params.conf;

    # 플러그인 파일을 화면에서 올릴 때를 대비한 상한. 기본값(1m)이면 413 이 난다
    client_max_body_size 100m;

    location / {
        # 분당 10회(API)·5회(로그인 폼), 순간적으로 10·5회까지는 바로 통과. 넘으면 429
        limit_req zone=jenkins_auth  burst=10 nodelay;
        limit_req zone=jenkins_login burst=5  nodelay;
        limit_req_status 429;

        proxy_pass http://jenkins_backend;
        proxy_http_version 1.1;
        proxy_redirect default;

        proxy_set_header Connection $jenkins_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        # Jenkins 가 자기 공개 주소(https://jenkins.beez.ai.kr)를 올바르게 알도록 원래 요청 정보를 넘긴다.
        # 빠지면 "리버스 프록시 설정이 잘못됨" 경고와 http 로 된 리다이렉트가 생긴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 빌드 로그처럼 흘러나오는 응답을 버퍼에 모으지 않고 바로 넘긴다
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
