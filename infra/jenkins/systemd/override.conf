# Jenkins systemd 덮어쓰기 설정 (S15P31A108-126).
# 서버 위치: /etc/systemd/system/jenkins.service.d/override.conf
# 패키지가 설치하는 jenkins.service 는 그대로 두고, 바꿀 값만 여기서 덮어쓴다(패키지 업그레이드에도 유지된다).

[Service]
# 8080 을 서버 자신(127.0.0.1)에서만 받는다. 외부 접근은 Nginx(jenkins.beez.ai.kr) 경유로만 한다.
Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"
Environment="JENKINS_PORT=8080"

# 설치 마법사를 끄고 보안·계정은 JCasC 파일로 만든다. headless 는 패키지 기본값을 그대로 이어 적은 것.
Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
Environment="CASC_JENKINS_CONFIG=/etc/jenkins/casc"

# JCasC 의 ${JENKINS_ADMIN_ID}·${JENKINS_ADMIN_PASSWORD} 값. root 전용(600) 파일이며 저장소에 넣지 않는다.
EnvironmentFile=/etc/jenkins/casc.env

# 새로 만드는 파일·폴더에 그룹 쓰기 권한을 남긴다(775/664). 배포 폴더를 ubuntu·jenkins 가 beez-deploy 그룹으로 함께 쓰므로,
# 기본값 022 이면 jenkins 가 만든 릴리스를 ubuntu 가 정리하지 못한다.
UMask=0002
