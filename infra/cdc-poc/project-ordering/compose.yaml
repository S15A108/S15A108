name: beez-cdc-ordering-test
services:
  postgres:
    image: postgres:17.6-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=12", "-c", "max_wal_senders=12"]
    environment:
      POSTGRES_USER: ordering_local
      POSTGRES_PASSWORD: ordering_local_only
      POSTGRES_DB: ordering_test
    volumes:
      - ordering-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering_local -d ordering_test"]
      interval: 5s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    volumes:
      - ordering-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
  connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: beez-ordering-test-connect
      CONFIG_STORAGE_TOPIC: ordering-test-connect-config
      OFFSET_STORAGE_TOPIC: ordering-test-connect-offset
      STATUS_STORAGE_TOPIC: ordering-test-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_FLUSH_INTERVAL_MS: "1000"
    ports:
      - "127.0.0.1:18087:8083"
volumes:
  ordering-postgres:
  ordering-kafka:
