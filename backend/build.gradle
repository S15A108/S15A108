plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.beez'
version = '0.0.1-SNAPSHOT'
description = 'BEEZ backend — 도메인·권한·판정의 진실의 원천'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '3.1.1'   // Spring Boot 4 대응 라인
    awsSdkVersion = '2.57.3'
}

dependencies {
    // Spring Boot BOM 으로 버전 관리 (별도 dependency-management 플러그인 불필요)
    // annotationProcessor 는 implementation 을 상속하지 않으므로 BOM 을 따로 걸어야 lombok 등 버전이 잡힌다
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    developmentOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.kafka:spring-kafka'

    // OpenAPI 문서 (/swagger-ui.html, /v3/api-docs)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // S3-compatible API: explicit SeaweedFS endpoint, not an implicit AWS connection.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql' // Structured constraint diagnostics; never log server detail/message.

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 개발 중 compose.yaml 의 Postgres 를 자동으로 띄우고 연결 (테스트 classpath 에는 포함되지 않음)
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'   // Testcontainers 2.x 이름
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()   // /actuator/info 에 빌드 정보 노출
}

// 테스트 계층 분리.
//  - test            : 빠른 층(단위·슬라이스). PR 마다 돈다. Docker 불필요. 시간 예산 60초.
//  - integrationTest : 느린 층(@Tag("integration") — SpringBootTest + Testcontainers). Docker 필요.
//                      PR 에서는 핵심만, 전체는 dev 머지 후 돈다. `build`/`check` 에는 포함하지 않는다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs @Tag("integration") tests (Spring context + Testcontainers). Docker required.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
