# 운영: 환경변수 필수(기본값 없음), compose 자동 기동 끔, 헬스 상세 숨김
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  docker:
    compose:
      enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true              # HTTPS(Nginx 종단)에서만 세션 쿠키 전송

management:
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    com.beez: INFO
    org.hibernate.SQL: WARN

beez:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    base-url: ${AI_BASE_URL}
    internal-token: ${AI_INTERNAL_TOKEN}
  invitation:
    base-url: ${INVITE_BASE_URL}   # 프론트 오리진. 기본값(localhost)이 운영 초대 링크에 들어가지 않게 필수로 받는다
  agent:
    mcp-url: ${MCP_URL}            # 공개 /mcp 주소(Nginx 뒤). 같은 이유로 필수
